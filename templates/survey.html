{% extends 'layout.html' %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h1 class="h3">アンケート</h1>
    </div>
    <div class="card-body">
        <p>本研究に関するアンケートにご協力ください。</p>
        <form method="post">
            
            <div class="mb-4">
                <label class="form-label fw-bold">1. あなたが雇い主なら来客予測を使いたいですか？</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="q1_use_forecast" id="q1_yes" value="はい" required>
                    <label class="form-check-label" for="q1_yes">はい</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="q1_use_forecast" id="q1_no" value="いいえ">
                    <label class="form-check-label" for="q1_no">いいえ</label>
                </div>
            </div>
            
            <div class="mb-4" id="q1_reason_div" style="display: none;">
                <label for="q1_reason" class="form-label">どのような目的で使いますか？（記述式）</label>
                <textarea class="form-control" id="q1_reason" name="q1_reason" rows="3"></textarea>
            </div>
            <hr>

            <div class="mb-4">
                <label class="form-label fw-bold">2. 来客する時に、来客者予想を見てみようと思いますか？</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="q2_check_forecast" id="q2_yes" value="はい" required>
                    <label class="form-check-label" for="q2_yes">はい</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="q2_check_forecast" id="q2_no" value="いいえ">
                    <label class="form-check-label" for="q2_no">いいえ</label>
                </div>
            </div>
            <hr>
            
            <div class="mb-4">
                <label class="form-label fw-bold">3. 次の各項目について、あなたの来店にどの程度影響を与えると思いますか？</label>
                <div class="table-responsive">
                    <table class="table table-bordered text-center">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 40%;">要素</th>
                                <th style="width: 20%;">低</th>
                                <th style="width: 20%;">中</th>
                                <th style="width: 20%;">高</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for factor in q3_factors %}
                            <tr>
                                <td class="text-start">{{ factor }}</td>
                                <td><input class="form-check-input" type="radio" name="q3_factor_{{ loop.index0 }}" value="1" required></td>
                                <td><input class="form-check-input" type="radio" name="q3_factor_{{ loop.index0 }}" value="2"></td>
                                <td><input class="form-check-input" type="radio" name="q3_factor_{{ loop.index0 }}" value="3"></td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
            <hr>

            <div class="mb-3">
                <label for="comment" class="form-label fw-bold">ご意見・ご感想</label>
                <textarea class="form-control" id="comment" name="comment" rows="4" placeholder="その他、何かコメントがあればご記入ください。"></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-lg">送信する</button>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const q1Radios = document.querySelectorAll('input[name="q1_use_forecast"]');
    const reasonDiv = document.getElementById('q1_reason_div');
    const reasonTextarea = document.getElementById('q1_reason');

    q1Radios.forEach(radio => {
        radio.addEventListener('change', function() {
            if (this.value === 'はい') {
                reasonDiv.style.display = 'block';
                reasonTextarea.required = true; // 「はい」の場合は必須入力にする
            } else {
                reasonDiv.style.display = 'none';
                reasonTextarea.required = false; // 「いいえ」の場合は必須を解除
                reasonTextarea.value = ''; // 内容をクリア
            }
        });
    });
});
</script>
{% endblock %}
